name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install OpenCV system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-0 libsm6 libxext6 libxrender1 libgl1

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install opencv-python-headless

      - name: Ruff (lint)
        run: ruff check legome tests scripts benchmarks

      - name: Ruff (format check)
        run: ruff format --check legome tests scripts benchmarks

      - name: Mypy
        run: mypy legome

      - name: Pytest (fast, with coverage)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ --cov=legome --cov-report=term-missing -m "not slow"

      - name: Pytest (slow / subprocess, append coverage)
        env:
          QT_QPA_PLATFORM: offscreen
        # QA-02: combined cov across fast + slow runs must be 100%.
        run: pytest tests/ --cov=legome --cov-append --cov-report=term-missing --cov-fail-under=100 -m slow

  build-wheel:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install --upgrade pip build

      - name: Build sdist + wheel
        run: python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
